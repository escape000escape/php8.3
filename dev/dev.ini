memory_limit = ${MEMORY_LIMIT:-512M}

upload_max_filesize = ${UPLOAD_MAX_FILESIZE:-50M}
post_max_size = ${POST_MAX_SIZE:-50M}
max_file_uploads = ${MAX_FILE_UPLOADS:-50}

max_execution_time = ${PHP_MAX_EXECUTION_TIME:-300}

realpath_cache_size = ${REALPATH_CACHE_SIZE:-512K}
realpath_cache_ttl = ${REALPATH_CACHE_TTL:-60}

error_log = ${ERROR_LOG:-/proc/self/fd/2}

date.timezone = ${DATE_TIMEZONE:-UTC}

session.save_handler = ${SESSION_SAVE_HANDLER:-files}
session.save_path = ${SESSION_SAVE_PATH:-/tmp}