[opcache]

opcache.enable=${PHP_OPCACHE_ENABLE:-1}
opcache.enable_cli=${PHP_OPCACHE_CLI_ENABLE:-1}

opcache.memory_consumption=${PHP_OPCACHE_MEMORY_CONSUMPTION:-128}
opcache.interned_strings_buffer=${PHP_OPCACHE_INTERNED_STRINGS_BUFFER:-8}

opcache.max_accelerated_files=${PHP_OPCACHE_MAX_ACCELERATED_FILES:-10000}

opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
opcache.revalidate_freq=${PHP_OPCACHE_REVALIDATE_FREQ:-0}

opcache.max_wasted_percentage=${PHP_OPCACHE_MAX_WASTED_PERCENTAGE:-10}

opcache.enable_file_override=${PHP_OPCACHE_ENABLE_FILE_OVERRIDE:-0}

opcache.log_verbosity_level=${PHP_OPCACHE_LOG_VERBOSITY_LEVEL:-2}

opcache.preload=${PHP_OPCACHE_PRELOAD:-}
opcache.preload_user=${PHP_OPCACHE_PRELOAD_USER:-www-data}

opcache.jit_buffer_size=${PHP_OPCACHE_JIT_BUFFER_SIZE:-0}
opcache.jit=${PHP_OPCACHE_JIT:-off}
