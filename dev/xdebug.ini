xdebug.mode=${PHP_XDEBUG_MODE:-off}

xdebug.start_with_request=${PHP_XDEBUG_START_WITH_REQUEST:-trigger}

xdebug.output_dir=${PHP_XDEBUG_OUTPUT_DIR:-/tmp}

xdebug.discover_client_host=${PHP_XDEBUG_DISCOVER_CLIENT_HOST:-1}
xdebug.client_host=${PHP_XDEBUG_CLIENT_HOST:-host.docker.internal}
xdebug.client_port=${PHP_XDEBUG_CLIENT_PORT:-9003}

xdebug.idekey=${PHP_XDEBUG_IDEKEY:-PHPSTORM}

xdebug.max_nesting_level=${PHP_XDEBUG_MAX_NESTING_LEVEL:-256}

date.timezone=${PHP_XDEBUG_TIMEZONE:-UTC}

memory_limit=${PHP_XDEBUG_MEMORY_LIMIT:-512M}